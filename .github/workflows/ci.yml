name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Node ships an older npm than the one package.json requires (engine-strict),
      # so install the exact version pinned in "packageManager".
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - run: npm ci

      # oxlint + oxfmt --check, then typecheck + test + build for every Nx project.
      - run: npm run check

  # Browser tests (Playwright + Chromium) against the built app. Runs in parallel with `check`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - run: npm ci

      # Chromium plus the system libraries it needs on Ubuntu.
      - run: npx playwright install --with-deps chromium
        working-directory: apps/e2e

      # Builds api + web, starts the API (serving the web build) on an in-memory DB, runs the specs.
      - run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 14
